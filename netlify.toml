[build]
  publish = "."
  command = "cd wardrobe && npm install --include=dev 2>/dev/null; true"

[functions]
  directory    = "wardrobe/netlify/functions"
  node_bundler = "esbuild"

# ── Wardrobe app routes ────────────────────────────────────────────────────────
[[redirects]]
  from   = "/wardrobe"
  to     = "/wardrobe/index.html"
  status = 200

[[redirects]]
  from   = "/wardrobe/"
  to     = "/wardrobe/index.html"
  status = 200

# ── Trading Bot app routes ────────────────────────────────────────────────────
[[redirects]]
  from   = "/tradingbot"
  to     = "/tradingbot/index.html"
  status = 200

[[redirects]]
  from   = "/tradingbot/"
  to     = "/tradingbot/index.html"
  status = 200

# ── The archived old site is kept for reference, never served ─────────────────
[[redirects]]
  from   = "/_archive_old_site/*"
  to     = "/"
  status = 301
  force  = true

# ── publish is ".", so these are uploaded. Nothing should be able to fetch them.
[[redirects]]
  from   = "/.git/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/node_modules/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/tools/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/.claude/*"
  to     = "/"
  status = 404
  force  = true

# ── Old marketing site URLs, sent to the pages that replaced them ─────────────
[[redirects]]
  from   = "/solutions"
  to     = "/work.html"
  status = 301

[[redirects]]
  from   = "/research"
  to     = "/work.html"
  status = 301

[[redirects]]
  from   = "/security"
  to     = "/capabilities.html"
  status = 301

[[redirects]]
  from   = "/about"
  to     = "/about.html"
  status = 301

[[redirects]]
  from   = "/contact"
  to     = "/contact.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
